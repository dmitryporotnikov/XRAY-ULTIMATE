name: Build & Release (Framework-Dependent .NET 10)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-framework-dependent:
    name: Build Framework-Dependent x64
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Calculate Auto-Incremented Version
        id: version
        shell: pwsh
        run: |
          $buildNumber = "${{ github.run_number }}"
          $version = "1.0.$buildNumber"
          Write-Host "Auto-incremented version: $version"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "TAG_NAME=v$version" >> $env:GITHUB_ENV

      - name: Restore NuGet Packages
        run: dotnet restore -p:Platform=x64

      - name: Publish Framework-Dependent Binary
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:Platform=x64
          -p:SelfContained=false
          -p:PublishTrimmed=false
          -p:PublishSingleFile=false
          -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ env.APP_VERSION }}
          -p:AssemblyVersion=${{ env.APP_VERSION }}.0
          -p:FileVersion=${{ env.APP_VERSION }}.0
          -p:InformationalVersion=${{ env.APP_VERSION }}
          -o ./dist/framework-dependent

      - name: Package Distribution Archive (ZIP)
        shell: pwsh
        run: |
          $zipPath = "./dist/XRAY_ULTIMATE_v${{ env.APP_VERSION }}_FrameworkDependent_x64.zip"
          Compress-Archive -Path ./dist/framework-dependent/* -DestinationPath $zipPath -Force
          Write-Host "Packaged framework-dependent archive at $zipPath"
          "PACKAGE_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Upload Build Artifact (PR & CI)
        uses: actions/upload-artifact@v4
        with:
          name: XRAY_ULTIMATE_v${{ env.APP_VERSION }}_FrameworkDependent_x64
          path: ${{ env.PACKAGE_PATH }}
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: XRAY ULTIMATE v${{ env.APP_VERSION }}
          body: |
            ## XRAY ULTIMATE v${{ env.APP_VERSION }} (Framework-Dependent Release)
            
            ### Package Details:
            - **Distribution Form**: Lightweight Win32 Portable Application
            - **Runtime Requirement**: **.NET 10 Desktop Runtime (x64)** must be installed on the target machine
            - **Target Architecture**: Windows x64 (64-bit)
            - **Integrity**: Runs elevated with administrative privileges (`requireAdministrator`)
            
            ### Included in this build:
            - Full silicon-level hardware diagnostics across 18 specialized views.
            - Real-time CPU, RAM, GPU (nvidia-smi), disk, and network sensor telemetry.
            - Kernel ACPI & DSDT table disassembler with Intel `iasl` syntax compatibility.
            - Integrated Windows service management and process tree termination.
            - Audit reporting in Interactive HTML, JSON, and ASCII plain text.
          files: ${{ env.PACKAGE_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
